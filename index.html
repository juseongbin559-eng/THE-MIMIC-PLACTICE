<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전선 퍼즐 & 랭킹/업적 시스템</title>
    <style>
        :root {
            --bg-color: #1a1c23;
            --panel-bg: #252836;
            --accent-color: #00e676;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { margin-bottom: 5px; color: var(--accent-color); }
        p { color: #a0a5b5; margin-top: 0; }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .game-card, .panel-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        /* 퍼즐 영역 */
        .game-card {
            position: relative;
            width: 400px;
            height: 380px;
            user-select: none;
        }

        .timer-display {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            background: #15171e;
            padding: 8px;
            border-radius: 6px;
        }

        .wire-box {
            position: relative;
            height: 280px;
            border: 2px solid #3b3f54;
            border-radius: 8px;
            background: #121319;
            overflow: hidden;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .node {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .node-left { left: 20px; }
        .node-right { right: 20px; }

        /* 패널 영역 */
        .side-panels {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px solid #3b3f54;
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .ranking-list, .achievement-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ranking-item, .achievement-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: #1c1e29;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .achievement-item {
            opacity: 0.4;
            transition: opacity 0.3s, border 0.3s;
        }

        .achievement-item.unlocked {
            opacity: 1;
            border: 1px solid var(--accent-color);
            background: #1b2e2b;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover { background: #00c853; }
    </style>
</head>
<body>

    <h1>⚡ 전선 퍼즐 & 랭킹 시스템</h1>
    <p>전선을 올바른 색상끼리 드래그하여 연결하세요!</p>

    <div class="container">
        <!-- 퍼즐 게임 판 -->
        <div class="game-card">
            <div class="timer-display">시간: <span id="timer">0.000</span>초</div>
            <div class="wire-box" id="wireBox">
                <svg id="svgCanvas"></svg>
            </div>
            <button class="btn" onclick="resetGame()">게임 재시작</button>
        </div>

        <!-- 우측 사이드 패널 (랭킹 및 업적) -->
        <div class="side-panels">
            <!-- 랭킹 -->
            <div class="panel-card">
                <div class="panel-title">🏆 명예의 전당 (Top 5)</div>
                <ol class="ranking-list" id="rankingList">
                    <li class="ranking-item">기록 없음</li>
                </ol>
            </div>

            <!-- 업적 -->
            <div class="panel-card">
                <div class="panel-title">🏅 도전 과제 / 업적</div>
                <div class="achievement-list">
                    <div class="achievement-item" id="ach-1">
                        <span>⚡ 첫 걸음</span>
                        <small>퍼즐 1회 성공</small>
                    </div>
                    <div class="achievement-item" id="ach-2">
                        <span>⚡ 신속한 손가락</span>
                        <small>3초 이내 성공</small>
                    </div>
                    <div class="achievement-item" id="ach-3">
                        <span>⚡ 전설의 엔지니어</span>
                        <small>1.8초 이내 성공</small>
                    </div>
                    <div class="achievement-item" id="ach-4">
                        <span>⚡ 퍼즐 마스터</span>
                        <small>총 5회 클리어</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const COLORS = ['#ff5252', '#448aff', '#ffd740', '#69f0ae']; // 빨, 파, 노, 초
        let connections = {}; // { leftIdx: rightIdx }
        let startNode = null;
        let startTime = null;
        let timerInterval = null;
        let isPlaying = false;
        let totalClears = parseInt(localStorage.getItem('wire_total_clears') || '0');

        // 초기화 및 게임 시작
        function resetGame() {
            const wireBox = document.getElementById('wireBox');
            const svg = document.getElementById('svgCanvas');
            
            // 기존 노드 제거
            document.querySelectorAll('.node').forEach(e => e.remove());
            svg.innerHTML = '';
            connections = {};
            startNode = null;
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('timer').innerText = "0.000";

            // 좌우 노드 배치 생성
            const leftColors = [...COLORS];
            const rightColors = [...COLORS].sort(() => Math.random() - 0.5);

            leftColors.forEach((color, i) => {
                createNode(20, 30 + i * 60, color, 'left', i);
            });

            rightColors.forEach((color, i) => {
                const originalIndex = COLORS.indexOf(color);
                createNode(350, 30 + i * 60, color, 'right', originalIndex);
            });

            updateAchievements();
            renderRankings();
        }

        function createNode(x, y, color, side, colorIndex) {
            const node = document.createElement('div');
            node.className = `node node-${side}`;
            node.style.top = y + 'px';
            node.style.backgroundColor = color;
            node.dataset.side = side;
            node.dataset.colorIndex = colorIndex;
            node.dataset.y = y + 15; // 중앙 y 좌표

            node.addEventListener('mousedown', (e) => startConnect(e, node));
            document.getElementById('wireBox').appendChild(node);
        }

        function startConnect(e, node) {
            if (node.dataset.side !== 'left') return;
            if (!isPlaying) {
                isPlaying = true;
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(3);
                }, 10);
            }
            startNode = node;
            window.addEventListener('mousemove', drawTempLine);
            window.addEventListener('mouseup', endConnect);
        }

        function drawTempLine(e) {
            if (!startNode) return;
            const boxRect = document.getElementById('wireBox').getBoundingClientRect();
            const startY = parseFloat(startNode.dataset.y);
            const currentX = e.clientX - boxRect.left;
            const currentY = e.clientY - boxRect.top;

            renderLines(currentX, currentY);
        }

        function endConnect(e) {
            window.removeEventListener('mousemove', drawTempLine);
            window.removeEventListener('mouseup', endConnect);

            if (!startNode) return;

            const elements = document.elementsFromPoint(e.clientX, e.clientY);
            const targetNode = elements.find(el => el.classList.contains('node-right'));

            if (targetNode) {
                const leftIdx = startNode.dataset.colorIndex;
                const rightIdx = targetNode.dataset.colorIndex;

                if (leftIdx === rightIdx) {
                    connections[leftIdx] = {
                        sy: parseFloat(startNode.dataset.y),
                        ey: parseFloat(targetNode.dataset.y),
                        color: startNode.style.backgroundColor
                    };
                    checkCompletion();
                }
            }
            startNode = null;
            renderLines();
        }

        function renderLines(tempX = null, tempY = null) {
            const svg = document.getElementById('svgCanvas');
            let html = '';

            // 확정된 전선 그리기
            Object.values(connections).forEach(line => {
                html += `<line x1="35" y1="${line.sy}" x2="350" y2="${line.ey}" stroke="${line.color}" stroke-width="6" stroke-linecap="round"/>`;
            });

            // 드래그 중인 임시 전선 그리기
            if (startNode && tempX !== null && tempY !== null) {
                const sy = parseFloat(startNode.dataset.y);
                const color = startNode.style.backgroundColor;
                html += `<line x1="35" y1="${sy}" x2="${tempX}" y2="${tempY}" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="4"/>`;
            }

            svg.innerHTML = html;
        }

        // 성공 판정 및 기록 저장
        function checkCompletion() {
            if (Object.keys(connections).length === COLORS.length) {
                clearInterval(timerInterval);
                const clearTime = parseFloat(((Date.now() - startTime) / 1000).toFixed(3));
                isPlaying = false;

                totalClears++;
                localStorage.setItem('wire_total_clears', totalClears);

                setTimeout(() => {
                    alert(`🎉 축하합니다! 클리어 타임: ${clearTime}초`);
                    saveRecord(clearTime);
                    updateAchievements(clearTime);
                }, 100);
            }
        }

        // 랭킹 저장 & 불러오기
        function saveRecord(time) {
            let rankings = JSON.parse(localStorage.getItem('wire_rankings') || '[]');
            const name = prompt("랭킹에 등록할 닉네임을 입력하세요:", "플레이어") || "익명";
            
            rankings.push({ name, time });
            rankings.sort((a, b) => a.time - b.time);
            rankings = rankings.slice(0, 5); // 상위 5개 유지

            localStorage.setItem('wire_rankings', JSON.stringify(rankings));
            renderRankings();
        }

        function renderRankings() {
            const rankings = JSON.parse(localStorage.getItem('wire_rankings') || '[]');
            const listEl = document.getElementById('rankingList');
            
            if (rankings.length === 0) {
                listEl.innerHTML = '<li class="ranking-item">기록 없음</li>';
                return;
            }

            listEl.innerHTML = rankings.map((r, i) => `
                <li class="ranking-item">
                    <span><strong>${i + 1}위.</strong> ${r.name}</span>
                    <span>${r.time.toFixed(3)}초</span>
                </li>
            `).join('');
        }

        // 업적 업데이트
        function updateAchievements(latestTime = null) {
            const achs = JSON.parse(localStorage.getItem('wire_achievements') || '{}');

            if (totalClears >= 1) achs['ach-1'] = true;
            if (latestTime && latestTime <= 3.0) achs['ach-2'] = true;
            if (latestTime && latestTime <= 1.8) achs['ach-3'] = true;
            if (totalClears >= 5) achs['ach-4'] = true;

            localStorage.setItem('wire_achievements', JSON.stringify(achs));

            Object.keys(achs).forEach(id => {
                if (achs[id]) {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('unlocked');
                }
            });
        }

        // 게임 최초 실행
        resetGame();
    </script>
</body>
</html>
