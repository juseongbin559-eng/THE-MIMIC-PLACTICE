<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더 미믹 - 거미 퇴치 퍼즐</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background-color: #111;
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      cursor: crosshair;
    }

    /* UI 상단 정보 */
    .ui-panel {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-weight: bold;
      font-size: 1.1rem;
      pointer-events: none;
    }

    .ammo-count { color: #ffd700; }
    .spider-hp { color: #ff4444; }

    /* 거미 (1번 이미지 - 흰색 보정) */
    #spider {
      position: absolute;
      width: 140px;
      height: 140px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 흰색 보정 (밝기 상승, 누런 빛 제거) */
      filter: brightness(1.6) contrast(1.2) grayscale(0.2);
      transition: opacity 0.3s;
    }

    /* 괴물 (2번 이미지) */
    #monster {
      position: absolute;
      width: 220px;
      bottom: -300px;
      right: 30px;
      transition: bottom 0.5s ease-out;
      z-index: 5;
    }

    #monster.active {
      bottom: 40px;
    }

    /* 히든 타이밍 게임 바 */
    .timing-game-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 40px;
      background-color: #222;
      border: 3px solid #555;
      border-radius: 8px;
      display: none;
      z-index: 20;
    }

    .timing-game-container.active {
      display: block;
    }

    /* 흰색 성공 구간 */
    .white-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 80px;
      background-color: #ffffff;
      box-shadow: 0 0 10px #ffffff;
    }

    /* 빨간색 이동 바 */
    .red-bar {
      position: absolute;
      top: 0;
      width: 10px;
      height: 100%;
      background-color: #ff0000;
      box-shadow: 0 0 8px #ff0000;
    }

    /* 타이밍 게임 진행도 안내 */
    .timing-status {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2rem;
      color: #00e676;
      font-weight: bold;
      display: none;
      z-index: 20;
    }

    .timing-status.active {
      display: block;
    }

    /* 게임 결과 레이어 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      display: none;
    }

    .overlay h2 {
      font-size: 2.5rem;
      color: #00e676;
      margin-bottom: 20px;
    }

    .overlay button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #00e676;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-container" id="game-container">
    <!-- UI 정보 -->
    <div class="ui-panel">
      <div class="ammo-count">남은 총알: <span id="ammo">15</span> / 15</div>
      <div class="spider-hp">거미 체력: <span id="hp">15</span> / 15</div>
    </div>

    <!-- 이미지 객체 (1번 거미, 2번 괴물) -->
    <img id="spider" src="1.jpg" alt="거미">
    <img id="monster" src="image_a73cd9.png" alt="괴물">

    <!-- 히든 타이밍 미니게임 -->
    <div class="timing-status" id="timing-status">괴물 퇴치 중... (0 / 3)</div>
    <div class="timing-game-container" id="timing-container">
      <div class="white-zone" id="white-zone"></div>
      <div class="red-bar" id="red-bar"></div>
    </div>

    <!-- 결과 화면 -->
    <div class="overlay" id="overlay">
      <h2>🎉 거미 퇴치 성공!</h2>
      <button onclick="restartGame()">다시 하기</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 게임 변수 설정
    // ==========================================
    let ammo = 15;
    let spiderHp = 15;
    let isHiddenGame = false;
    let timingSuccessCount = 0;

    // 거미 ∞ (누운 8자) 이동 패턴 관련 변수
    let angle = 0;
    const centerX = 400; // 게임 화면 중앙 X
    const centerY = 300; // 게임 화면 중앙 Y
    const scaleX = 220;  // 8자 가로 크기
    const scaleY = 100;  // 8자 세로 크기
    const speed = 0.035; // 에임으로 맞추기 적당한 속도

    // 요소 DOM 가져오기
    const spider = document.getElementById('spider');
    const monster = document.getElementById('monster');
    const ammoDisplay = document.getElementById('ammo');
    const hpDisplay = document.getElementById('hp');
    const gameContainer = document.getElementById('game-container');
    const timingContainer = document.getElementById('timing-container');
    const whiteZone = document.getElementById('white-zone');
    const redBar = document.getElementById('red-bar');
    const timingStatus = document.getElementById('timing-status');
    const overlay = document.getElementById('overlay');

    // ==========================================
    // 1. 거미 8자 이동 로직 (무한 루프)
    // ==========================================
    function moveSpider() {
      if (!isHiddenGame && spiderHp > 0) {
        angle += speed;

        // 누운 8자(Bernoulli's Lemniscate) 수학 공식을 적용한 이동
        const x = centerX + (scaleX * Math.cos(angle)) / (1 + Math.sin(angle) * Math.sin(angle));
        const y = centerY + (scaleY * Math.sin(angle) * Math.cos(angle)) / (1 + Math.sin(angle) * Math.sin(angle));

        spider.style.left = `${x}px`;
        spider.style.top = `${y}px`;
      }
      requestAnimationFrame(moveSpider);
    }
    moveSpider();

    // ==========================================
    // 2. 사격 로직 (클릭)
    // ==========================================
    gameContainer.addEventListener('click', (e) => {
      // 히든게임 진행 중이거나 총알이 없으면 사격 불가
      if (isHiddenGame || ammo <= 0 || spiderHp <= 0) return;

      ammo--;
      ammoDisplay.textContent = ammo;

      // 거미를 직접 클릭했는지 체크
      if (e.target === spider) {
        spiderHp--;
        hpDisplay.textContent = spiderHp;

        // 타격 피드백 (반짝임)
        spider.style.filter = 'brightness(3) contrast(1.2)';
        setTimeout(() => {
          spider.style.filter = 'brightness(1.6) contrast(1.2) grayscale(0.2)';
        }, 100);

        // 거미 잡음
        if (spiderHp <= 0) {
          spider.style.display = 'none';
          overlay.style.display = 'flex';
          return;
        }
      }

      // 15발을 다 쐈는데 거미를 못 잡은 경우 -> 히든게임 시작
      if (ammo === 0 && spiderHp > 0) {
        startHiddenGame();
      }
    });

    // ==========================================
    // 3. 히든 미니게임 (괴물 출현 & 스페이스바 타이밍)
    // ==========================================
    let redBarPos = 0;
    let redBarSpeed = 8;
    let redBarDir = 1; // 1: 오른쪽, -1: 왼쪽
    let timingAnimationId = null;
    let whiteZoneLeft = 0;

    function startHiddenGame() {
      isHiddenGame = true;
      timingSuccessCount = 0;

      // 괴물 등장 & UI 변경
      monster.classList.add('active');
      timingContainer.classList.add('active');
      timingStatus.classList.add('active');
      timingStatus.textContent = `괴물 퇴치 중... (${timingSuccessCount} / 3)`;

      resetTimingBar();
      animateRedBar();
    }

    // 흰색 구간 위치 랜덤 생성 및 빨간 바 위치 초기화
    function resetTimingBar() {
      const containerWidth = 500;
      const zoneWidth = 80;

      // 랜덤한 위치에 흰색 구간 배치 (여백 확보)
      whiteZoneLeft = Math.floor(Math.random() * (containerWidth - zoneWidth - 40)) + 20;
      whiteZone.style.left = `${whiteZoneLeft}px`;

      redBarPos = 0;
    }

    // 빨간 바 좌우 진동 애니메이션
    function animateRedBar() {
      if (!isHiddenGame) return;

      redBarPos += redBarSpeed * redBarDir;

      if (redBarPos >= 490) {
        redBarPos = 490;
        redBarDir = -1;
      } else if (redBarPos <= 0) {
        redBarPos = 0;
        redBarDir = 1;
      }

      redBar.style.left = `${redBarPos}px`;
      timingAnimationId = requestAnimationFrame(animateRedBar);
    }

    // 스페이스바 입력 판정
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && isHiddenGame) {
        e.preventDefault();

        // 빨간 바 위치가 흰색 구간 내에 있는지 검사
        const redBarCenter = redBarPos + 5;
        const isSuccess = redBarCenter >= whiteZoneLeft && redBarCenter <= (whiteZoneLeft + 80);

        if (isSuccess) {
          timingSuccessCount++;
          timingStatus.textContent = `괴물 퇴치 중... (${timingSuccessCount} / 3)`;

          if (timingSuccessCount >= 3) {
            // 히든게임 성공 -> 괴물 도망치고 재장전
            endHiddenGame();
          } else {
            resetTimingBar();
          }
        } else {
          // 실패 시 재시도 안내 피드백
          timingStatus.style.color = '#ff4444';
          setTimeout(() => timingStatus.style.color = '#00e676', 300);
        }
      }
    });

    // 히든게임 완료 (괴물 도망 + 총알 15발 지급)
    function endHiddenGame() {
      isHiddenGame = false;
      cancelAnimationFrame(timingAnimationId);

      monster.classList.remove('active');
      timingContainer.classList.remove('active');
      timingStatus.classList.remove('active');

      // 총알 15발 재충전 및 거미 사격 다시 시작
      ammo = 15;
      ammoDisplay.textContent = ammo;
      alert('괴물이 도망쳤습니다! 총알 15발이 재충전되었습니다.');
    }

    // 전체 리셋 (거미 잡은 후 다시 하기)
    function restartGame() {
      ammo = 15;
      spiderHp = 15;
      isHiddenGame = false;

      ammoDisplay.textContent = ammo;
      hpDisplay.textContent = spiderHp;
      spider.style.display = 'block';
      overlay.style.display = 'none';

      monster.classList.remove('active');
      timingContainer.classList.remove('active');
      timingStatus.classList.remove('active');
    }
  </script>
</body>
</html>
